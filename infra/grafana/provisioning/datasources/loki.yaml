apiVersion: 1
datasources:
  - name: Loki
    type: loki
    uid: loki
    access: proxy
    url: http://loki:3100
    isDefault: false
    editable: false
    jsonData:
      derivedFields:
        - datasourceUid: tempo
          matcherRegex: '"trace_id":"([a-f0-9]{32})"'
          name: TraceID
          url: '$$${__value.raw}'
          urlDisplayLabel: Open in Tempo
        - datasourceUid: tempo
          matcherRegex: 'trace_id=([a-f0-9]{32})'
          name: TraceID
          url: '$$${__value.raw}'
          urlDisplayLabel: Open in Tempo
