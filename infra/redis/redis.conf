# redis.conf — Voice Pipeline
#
# Redis serves three distinct workloads inside this pipeline. Every directive
# is annotated with which workload(s) it affects so you know exactly what
# breaks when you change a value.
#
#   [LLM]      LLM response cache         llm:v3:*           TTL = LLM_CACHE_TTL (3600s default)
#   [LOCK]     Cache stampede locks        llm:stampede:*     TTL = 30s
#   [SESSION]  IP-locked session store     session:lock:v1:*  TTL = SESSION_TTL_S + SESSION_GRACE_S
#                                          session:data:v1:*
#                                          session:meta:v1:*
#
# How to apply changes without a restart:
#   redis-cli CONFIG SET <directive> <value>
#   redis-cli CONFIG REWRITE   (writes current live config back to this file)
#
# Key sizing quick reference:
#   LLM cache entry:    ~2–8 KB JSON          TTL 3600s   evicted by allkeys-lru
#   Stampede lock:      ~20 bytes string       TTL 30s     NX write, deleted on LLM completion
#   Session lock:       ~20 bytes sentinel     TTL 120s    NX write, deleted on session end
#   Session data:       ~2–20 KB JSON blob     TTL 120s    updated every conversation turn
#   Session meta:       ~36 bytes UUID string  TTL 120s    ip_hash → session_id lookup


# ─────────────────────────────────────────────────────────────────────────────
# NETWORKING
# ─────────────────────────────────────────────────────────────────────────────

# [ALL] Interface binding.
# In development / Docker: bind 0.0.0.0 so the host app can reach the container.
# For an isolated internal network, bind only to the private interface, e.g.:
#   bind 10.0.0.5 127.0.0.1
# Never bind to 0.0.0.0 without firewall rules on a public host.
bind 0.0.0.0

# [ALL] Primary Redis port.
port 6379

# [ALL] TLS port (mutual TLS for inter-service encryption in production).
# Requires tls-cert-file, tls-key-file, and tls-ca-cert-file below.
# Comment out the port line and enable tls-port to enforce TLS-only mode.
# tls-port 6380
# tls-cert-file /etc/redis/tls/redis.crt
# tls-key-file  /etc/redis/tls/redis.key
# tls-ca-cert-file /etc/redis/tls/ca.crt
# tls-auth-clients yes
# tls-protocols "TLSv1.2 TLSv1.3"
# tls-ciphers "ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384"
# tls-prefer-server-ciphers yes
# tls-session-caching yes
# tls-session-cache-size 5000
# tls-session-cache-timeout 60

# [ALL] Protected mode refuses external connections when no auth is configured.
# Set to yes in development; force to no only when you know you have a password
# or ACL rules protecting the port.
protected-mode yes

# [ALL] Require a password for the default user.
# In Docker, this should be injected via an environment variable or Docker secret:
#   REDIS_PASSWORD=$(cat /run/secrets/redis_password)
#   redis-server /etc/redis/redis.conf --requirepass "$REDIS_PASSWORD"
# Do NOT hard-code the password here in version-controlled files.
# requirepass your_strong_password_here

# [ALL] Unix socket as an alternative for same-host connections.
# Avoids TCP overhead for the LLM and session pools running on the same machine.
# Disable in Docker multi-container setups — use the TCP port instead.
# unixsocket /var/run/redis/redis.sock
# unixsocketperm 770

# [ALL] Idle client connection timeout in seconds.
# The Python pools (REDIS_MAX_CONN=200 for LLM, 200 for sessions) use
# health-check-interval=30s by default. A timeout of 300s gives 10 full
# check cycles before Redis closes an idle socket, preventing stale-handle
# errors under low-traffic conditions.
timeout 300

# [ALL] OS-level TCP keepalive interval (seconds).
# Forces the kernel to send ACK probes to idle clients on this interval.
# Prevents silent NAT-table drops that would leave pool handles in a
# "connected but broken" state. 60s is safe for any cloud NAT configuration.
tcp-keepalive 60

# [ALL] Size of the TCP accept backlog.
# Increase this in high-concurrency deployments where many connections arrive
# simultaneously (e.g. a cold start after a deployment). Default is 511.
# Linux clamps this to /proc/sys/net/core/somaxconn — set both to the same value.
tcp-backlog 511

# [ALL] Maximum simultaneous client connections.
# LLM service pool:       REDIS_MAX_CONN = 200
# Session store pool:     REDIS_MAX_CONN = 200 (separate pool, same setting)
# Prometheus/test/admin:  ~10 overhead
# Total observed maximum: ~410; 512 adds ~25% headroom for burst connections
# and admin CLI usage without dropping requests.
maxclients 512

# [ALL] Socket receive/send buffer sizes (bytes). 0 = OS default.
# Increase to 256 KB for latency-sensitive LLM cache reads if your OS allows it.
# Usually not necessary unless default kernel buffers are < 65 KB.
# socket-mark-id 0


# ─────────────────────────────────────────────────────────────────────────────
# GENERAL RUNTIME
# ─────────────────────────────────────────────────────────────────────────────

# Run as a background daemon (yes) or stay in the foreground (no).
# Set to no when managed by Docker, systemd, or supervisord — those supervisors
# expect the process to remain in the foreground so they can track it correctly.
daemonize no

# [ALL] Log verbosity. One of: debug, verbose, notice, warning.
# Use notice in development (meaningful events without spam), warning in production.
loglevel notice

# Log output destination. Empty string = stdout, useful for Docker log collection.
logfile ""

# Number of databases (0–15). The pipeline uses DB 0 only — additional DBs can
# be reserved for testing (DB 1) or a secondary workload if needed.
databases 16

# Show a Redis logo in the startup banner. Cosmetic — disable to reduce log noise.
always-show-logo no

# Crash log detail level. Moderate is appropriate for production:
# it includes register dumps on signal-induced crashes without excessive overhead.
crash-log-enabled yes
crash-memlog-enabled yes


# ─────────────────────────────────────────────────────────────────────────────
# SECURITY — ACCESS CONTROL LISTS (ACLs)
# ─────────────────────────────────────────────────────────────────────────────
#
# ACLs restrict which commands each connection pool can execute and which key
# patterns it can touch. This contains the blast radius of a compromised credential:
# a stolen LLM service credential cannot read or delete session data.
#
# How to apply:
#   1. Uncomment aclfile below and create /etc/redis/acl/users.acl.
#   2. Add the user definitions there (one per line).
#   3. Remove any requirepass directive — ACLs replace it.
#
# Example ACL file content (users.acl):
#
#   # Default user: disabled — forces all connections to use a named account.
#   user default off nopass nocommands nokeys
#
#   # LLM cache service: can only touch llm:* keys and use a safe subset of commands.
#   user llm_service on >LLM_SERVICE_PASSWORD ~llm:* &* +GET +SET +SETEX +SETNX +DEL +TTL +EXPIRE +PING +QUIT
#
#   # Session service: can only touch session:* keys.
#   user session_service on >SESSION_PASSWORD ~session:* &* +GET +SET +SETEX +SETNX +DEL +TTL +EXPIRE +KEYS +PING +QUIT
#
#   # Admin: full access for maintenance scripts and monitoring.
#   user admin on >ADMIN_PASSWORD ~* &* +@all
#
#   # Prometheus redis-exporter: read-only INFO and CONFIG GET for metrics.
#   user redis_exporter on >EXPORTER_PASSWORD ~* &* +INFO +CONFIG|GET +DBSIZE +PING +QUIT
#
# aclfile /etc/redis/acl/users.acl

# Log failed authentication attempts and ACL violations. Essential for detecting
# brute-force attacks and misconfigured clients in production.
acllog-max-len 256


# ─────────────────────────────────────────────────────────────────────────────
# MEMORY MANAGEMENT
# ─────────────────────────────────────────────────────────────────────────────

# [LLM][SESSION][LOCK] Hard memory ceiling for the Redis process.
# Sizing guide:
#   - LLM cache: avg_response_kb × expected_concurrent_unique_prompts × 1.5
#     e.g. 5 KB × 5000 prompts × 1.5 overhead = ~37 MB minimum
#   - Session data: avg_session_kb × max_active_sessions
#     e.g. 10 KB × 100 sessions = 1 MB (negligible)
#   - Stampede locks: ~20 bytes × max_concurrent = negligible
#   512 MB is comfortable for development; scale up for production by profiling
#   redis-cli INFO memory after a representative traffic period.
maxmemory 512mb

# [LLM] Eviction policy when maxmemory is reached.
# allkeys-lru is correct because:
#   - All three key families have explicit TTLs set by the application.
#   - LRU eviction preferentially removes stale LLM responses, not session data,
#     because session keys are accessed frequently (every turn) while LLM cache
#     entries may go hours without a hit.
#   - volatile-lru would also work, but allkeys-lru is more aggressive and
#     avoids memory fragmentation from keys without expiry (if any escape through).
#   Do NOT use noeviction — the pipeline will return OOM errors instead of degrading.
maxmemory-policy allkeys-lru

# [LLM] LRU approximation sample count.
# Redis samples N random keys and evicts the LRU among them. Higher values
# approach true LRU quality at marginally higher CPU cost per eviction.
# 10 provides an excellent approximation. Default is 5.
maxmemory-samples 10

# [SESSION] Active expire cycle frequency and effort.
# Redis runs an active expiry scan every hz cycles per second. The pipeline's
# SESSION keys have TTLs of ~120s and LLM keys have TTLs of 3600s.
# hz=15 gives good expired-key throughput without burning CPU between requests.
# In a write-heavy LLM caching workload, higher hz is beneficial. Max is 500.
hz 15

# [ALL] Dynamic hz — Redis automatically scales the event loop frequency from hz
# to (hz × 10) when there are many connected clients or pending events. This
# keeps latency low during traffic bursts without wasting CPU at idle.
dynamic-hz yes

# [LLM] LFU (Least Frequently Used) decay time in minutes.
# Used only when maxmemory-policy is allkeys-lfu or volatile-lfu.
# If you switch to LFU, set lfu-decay-time to match LLM_CACHE_TTL / 60.
# For LRU policy (current), these two directives are ignored.
lfu-log-factor 10
lfu-decay-time 1

# [ALL] Maximum number of bytes Redis will allocate per object using jemalloc
# arena purging. 0 = default. Tune only if you observe chronic memory fragmentation
# reported by redis-cli INFO memory (mem_fragmentation_ratio > 1.5 sustainedly).
# active-defrag-enabled no (requires compile-time flag MALLOC=libc, not default)


# ─────────────────────────────────────────────────────────────────────────────
# LAZY FREEING (NON-BLOCKING DELETES)
# ─────────────────────────────────────────────────────────────────────────────
#
# Large Redis objects (e.g. a 100-turn session history JSON blob) take measurable
# wall time to free. Lazy freeing moves the deallocation to a background thread
# so DEL and EXPIRE do not block the main event loop.
#
# [SESSION] Session data blobs can be 2–20 KB after many turns. Lazy free
# prevents a spike in command latency at session-end time.
#
# [LLM] LLM response blobs are 2–8 KB each. At high eviction rates under maxmemory
# pressure, lazy eviction keeps command latency stable.

lazyfree-lazy-eviction yes
lazyfree-lazy-expire yes
lazyfree-lazy-server-del yes
lazyfree-lazy-user-del yes
lazyfree-lazy-user-flush yes


# ─────────────────────────────────────────────────────────────────────────────
# PERSISTENCE — APPEND-ONLY FILE (AOF)
# ─────────────────────────────────────────────────────────────────────────────
#
# Strategy: AOF with everysec fsync.
#
# Why AOF over RDB snapshots?
#   RDB snapshots are sufficient for the LLM cache — losing cached responses is
#   safe; they are re-populated on the next cache miss. However, SESSION data
#   loss mid-conversation means the user loses their entire interview history,
#   which surfaces as a broken interview experience. AOF with everysec limits
#   that loss to ≤ 1 second of writes in the worst case (unclean shutdown).
#
# Why everysec, not always?
#   The stampede lock workload is write-intensive (SETNX per LLM request).
#   always-fsync flushes to disk on every write — this would make Redis as slow
#   as a relational database under cache-miss load. everysec is the correct
#   balance: durable enough for session data, fast enough for cache operations.
#
# Why not disable persistence entirely (appendonly no)?
#   Only acceptable if you have a persistent backing store for sessions (e.g.
#   MongoDB) and are willing to lose all in-flight sessions on a Redis restart.
#   The current pipeline uses Redis as the primary session store, so AOF is
#   the minimum viable durability guarantee.

appendonly yes
appendfilename "voice_pipeline.aof"

# Fsync strategy: always | everysec | no
# always   = max durability (fsync every write), lowest throughput
# everysec = ≤1 second data loss, high throughput — correct for this workload
# no       = OS decides when to flush, no durability guarantee
appendfsync everysec

# [LLM] Disable fsync during AOF background rewrite.
# When the rewrite fork runs, the parent Redis process continues to handle
# client writes and accumulates them in a buffer. Setting this to yes allows
# the OS to batch those writes rather than fsyncing each one. This trades
# a small additional data-loss window (already covered by everysec) for
# dramatically lower latency during rewrite, which can take 5–30s under load.
no-appendfsync-on-rewrite yes

# Rewrite the AOF file in the background when it has grown by this percentage
# since the last rewrite, but only if it has reached the minimum size.
# With high LLM cache write throughput, the AOF can grow quickly.
# 100% / 64mb: rewrite roughly doubles the growth, compacting tombstones.
auto-aof-rewrite-percentage 100
auto-aof-rewrite-min-size 64mb

# If the last AOF rewrite failed, continue accepting writes anyway.
# Failing open is preferable to stalling all writes because the disk filled
# up — the pipeline stays up and you get alerted via Prometheus / Grafana.
aof-rewrite-incremental-fsync yes

# [SESSION] Validate the AOF on startup by loading it completely.
# On a dirty shutdown, the AOF may be truncated mid-write. yes = reject it
# and refuse to start (safe). no = silently truncate and continue (risky).
# This is deliberately left to the operator — the correct value depends on
# whether you have a MongoDB-backed session fallback.
aof-use-rdb-preamble yes


# ─────────────────────────────────────────────────────────────────────────────
# PERSISTENCE — RDB SNAPSHOTS (background)
# ─────────────────────────────────────────────────────────────────────────────
#
# With AOF enabled, RDB snapshots are supplementary. They provide a faster
# restart path (loading an RDB is O(N) in entries, AOF replay is O(writes)).
# When both exist on startup, Redis loads the RDB first then replays only the
# AOF delta since the last RDB snapshot.
#
# Snapshot schedule: "after K writes, if N seconds have elapsed"
#   save <seconds> <writes>
#
# The schedule below covers three traffic regimes:
#   - Idle to moderate (one write in 15 minutes): snapshot for safety.
#   - Moderate (100 writes in 5 minutes): covers LLM cache misses.
#   - Heavy (10,000 writes in 1 minute): covers stampede lock storms.
#
# To disable RDB entirely (AOF-only mode), comment out all save lines and add:
#   save ""

save 900 1
save 300 100
save 60 10000

# RDB file name and storage directory.
dbfilename voice_pipeline.rdb
dir /data

# Compress RDB with LZF. Saves ~20% disk space at a small CPU cost during save.
rdbcompression yes

# CRC64 checksum on the RDB file. Detects corrupt saves at the cost of
# ~10% additional save/load time. Always keep this enabled.
rdbchecksum yes

# If an RDB save fails, refuse further write commands until persistence is restored.
# This surfaces persistence failures immediately rather than silently accumulating
# data that will be lost on the next restart.
stop-writes-on-bgsave-error yes


# ─────────────────────────────────────────────────────────────────────────────
# REPLICATION
# ─────────────────────────────────────────────────────────────────────────────
#
# Single-node configuration by default. To add a replica for read scaling
# or high availability, uncomment and configure these directives on the replica:
#
#   replicaof <primary-host> 6379
#   replica-serve-stale-data yes     -- serve (possibly stale) data while syncing
#   replica-read-only yes            -- replicas refuse writes from clients
#   replica-lazy-flush yes           -- flush replica DB lazily during SYNC
#   replica-priority 100             -- Sentinel replica selection priority
#   min-replicas-to-write 1          -- primary refuses writes unless N replicas are up
#   min-replicas-max-lag 10          -- replica must be < N seconds behind
#
# Replication auth (if requirepass or ACLs are enabled on the primary):
#   masterauth <primary-password>    -- used by replica to authenticate to primary
#   masteruser <acl-username>        -- used with ACL-based replication auth
#
# For Redis Sentinel (automatic failover), these settings are managed by
# the Sentinel configuration file, not here.
#
# For Redis Cluster (horizontal sharding across multiple nodes), replace this
# file entirely with a cluster-enabled configuration:
#   cluster-enabled yes
#   cluster-config-file nodes.conf
#   cluster-node-timeout 5000


# ─────────────────────────────────────────────────────────────────────────────
# SLOW LOG — LATENCY DIAGNOSTICS
# ─────────────────────────────────────────────────────────────────────────────
#
# [ALL] Record commands that take longer than slowlog-log-slower-than microseconds.
# The LLM cache GET and SET should complete in < 1ms. Session HGET/HSET should
# complete in < 2ms. Flag anything > 10ms as anomalous.
#
# Retrieve with: redis-cli SLOWLOG GET 10
# Reset with:    redis-cli SLOWLOG RESET

slowlog-log-slower-than 10000
slowlog-max-len 256


# ─────────────────────────────────────────────────────────────────────────────
# LATENCY MONITORING
# ─────────────────────────────────────────────────────────────────────────────
#
# Redis built-in latency tracking. Monitors event types (command, fork, rdb, aof)
# and records spikes for retrieval via LATENCY HISTORY / LATEST.
#
# Threshold in milliseconds: report a spike if a monitored event takes > N ms.
# 10ms is a reasonable starting point for this pipeline's latency budget.
# Lower to 1ms if you want to see everything; raise if you have high baseline latency.
#
# View latency history:  redis-cli LATENCY HISTORY command
# View latest spikes:    redis-cli LATENCY LATEST

latency-monitor-threshold 10

# [ALL] Enable the event-level latency framework.
latency-tracking yes

# Fine-grained per-command latency percentile histograms (Redis 7.x+).
# Enables redis-cli LATENCY HISTOGRAM which shows p50/p95/p99 per command class.
# Useful for confirming that GET latency < SET latency < SETNX latency
# matches the expected profile for the three workloads above.
latency-tracking-info-percentiles 50 95 99


# ─────────────────────────────────────────────────────────────────────────────
# KEYSPACE NOTIFICATIONS
# ─────────────────────────────────────────────────────────────────────────────
#
# [SESSION] Publish keyspace events so the application can be notified when a
# session key expires. This allows the session store to decrement the
# ai_session_active Prometheus gauge even when the session expires silently
# (no explicit POST /session/end call, user just stops responding).
#
# Event classes:
#   K  = Keyspace events (published to __keyspace@<db>__ channels)
#   E  = Keyevent events (published to __keyevent@<db>__ channels)
#   x  = Expired events
#   g  = Generic commands (DEL, EXPIRE, RENAME, ...)
#   $  = String commands (SET, GET, APPEND, ...)
#
# "Kxg" = keyspace events for key expiry and DEL (minimal overhead).
# "" = disabled (default, safest for CPU). Enable only if you subscribe to
# these channels. An empty subscriber pool creates unnecessary pub/sub overhead.
#
# To enable: set notify-keyspace-events Kxg
# The session_store.py subscriber would then listen on:
#   __keyevent@0__:expired
# and match keys against the session:lock:v1:* pattern.

notify-keyspace-events "Kxg"
# K = Keyspace events (prefix __keyspace@<db>__)
# x = Expired events (fires when a key expires — catches session TTL churn)
# g = Generic commands (DEL, EXPIRE, RENAME — catches stampede lock releases)
#
# This enables Prometheus alerting on session expiry rate and lock turnover.
# The redis-exporter exposes redis_expired_keys_total which counts these events.
# To monitor with PSUBSCRIBE from Python: __keyspace@0__:session:lock:v1:*


# ─────────────────────────────────────────────────────────────────────────────
# THREADING
# ─────────────────────────────────────────────────────────────────────────────
#
# [LLM] I/O threading for read-heavy workloads.
# The LLM cache GET operations are the hottest path. With io-threads > 1,
# Redis uses background threads to read client buffers in parallel, freeing
# the main thread for pure command processing.
#
# io-threads 4 = good starting point for 4-core machines.
# io-threads-do-reads yes = also thread the read path, not just writes.
#
# Enable only if you have >= 4 CPU cores and are consistently seeing
# > 50k GET ops/sec. For development, 1 thread (default) is sufficient.

io-threads 4
# 4 threads parallelises network I/O for the LLM-cache hot path.
# The LLM cache GET (llm:v3:* keys, 2-8 KB JSON) is the hottest path
# in the pipeline. With io-threads > 1, Redis can receive and send
# responses on multiple threads while the command thread stays single.
# Safe on any 4-core machine. Set to 1 on single-core hosts.
io-threads-do-reads yes
# Also thread the read path (RECV), not just writes. Combined with io-threads 4
# this roughly doubles throughput for the read-heavy LLM cache workload.


# ─────────────────────────────────────────────────────────────────────────────
# CLIENT OUTPUT BUFFER LIMITS
# ─────────────────────────────────────────────────────────────────────────────
#
# Prevent a single slow client from consuming unbounded server memory.
# The three client classes are: normal, slave (replica), pubsub.
#
# Format: client-output-buffer-limit <class> <hard-limit> <soft-limit> <soft-seconds>
#   hard-limit:    disconnect immediately when buffer exceeds this size.
#   soft-limit:    disconnect if buffer exceeds this for soft-seconds continuously.
#   0 = no limit.
#
# [LLM][SESSION] Normal clients (app connection pools):
#   Hard limit 256 MB prevents a stalled client from OOM-killing the instance.
#   The LLM cache responses are ≤ 8 KB, so a normal client should never
#   accumulate more than a few MB unless the pool is severely blocked.
#
# [REPLICA] Replica clients:
#   256 MB hard / 64 MB soft for 60s. Covers full initial sync of a large dataset.
#
# [PUBSUB] Keyspace notification subscribers (if enabled above):
#   32 MB hard / 8 MB soft for 60s. Sized for infrequent expiry events.

client-output-buffer-limit normal 256mb 64mb 60
client-output-buffer-limit replica 256mb 64mb 60
client-output-buffer-limit pubsub 32mb 8mb 60


# ─────────────────────────────────────────────────────────────────────────────
# CLIENT QUERY BUFFER
# ─────────────────────────────────────────────────────────────────────────────
#
# Maximum size of the buffer for a single client command (bytes).
# Default is 1 GB (too large). The largest legitimate payload is an LLM
# cache SET with a ~8 KB response blob. 16 MB is a comfortable ceiling that
# prevents a malformed client from allocating 1 GB in a single command.

client-query-buffer-limit 16mb


# ─────────────────────────────────────────────────────────────────────────────
# INLINE COMMAND SUPPORT
# ─────────────────────────────────────────────────────────────────────────────
#
# Disable inline commands (telnet-style "PING\r\n") to reduce attack surface.
# All clients use the RESP binary protocol.

enable-protected-configs no
enable-debug-command no


# ─────────────────────────────────────────────────────────────────────────────
# LUA SCRIPTING
# ─────────────────────────────────────────────────────────────────────────────
#
# [LOCK] The stampede lock in LLM_service.py uses SETNX + EXPIRE separately.
# If you refactor it to use a Lua script for atomic lock-with-TTL, the
# script must complete within lua-time-limit milliseconds or Redis
# terminates it (SCRIPT KILL) and the lock is left undetermined.
# 5000ms (5s) is far more than any lock script needs; reduce to 500ms
# for stricter safety.

lua-time-limit 5000

# [LOCK] EVALSHA cache size — number of scripts Redis keeps in its internal cache.
# Small scripts like a lock-and-set take < 1 KB each. 50 entries is plenty.
# lua-script-cache-size 1mb (Redis 7.4+ directive; ignored on older versions)


# ─────────────────────────────────────────────────────────────────────────────
# ACTIVE DEFRAGMENTATION (jemalloc)
# ─────────────────────────────────────────────────────────────────────────────
#
# [LLM] The LLM cache workload creates and deletes many small objects (2–8 KB
# JSON blobs). Over time, jemalloc can fragment the heap, causing
# mem_fragmentation_ratio to creep above 1.5. Active defrag compacts live objects
# online without a restart. Requires Redis compiled with libjemalloc (default).
#
# Enable active defrag if you observe sustained mem_fragmentation_ratio > 1.5
# in redis-cli INFO memory. Disabled by default because it adds ~5% CPU overhead.

activedefrag yes
# Active defragmentation compacts memory in the background, reclaiming
# fragmented space without a restart. For a session store that constantly
# creates and expires 2-20 KB JSON blobs (session:data:v1:*), fragmentation
# accumulates over time. activedefrag prevents gradual memory growth that
# would otherwise require periodic Redis restarts under sustained load.

# Minimum fragmentation ratio at which defrag kicks in. Below this, no defrag runs.
active-defrag-ignore-bytes 100mb
active-defrag-threshold-lower 10

# Maximum fragmentation ratio at which defrag applies maximum effort.
active-defrag-threshold-upper 100

# CPU usage fraction allocated to defrag. 1% lower bound, 25% upper bound.
active-defrag-cycle-min 1
active-defrag-cycle-max 25

# Maximum number of set/hash/zset/list fields to actively defrag per cycle.
active-defrag-max-scan-fields 1000


# ─────────────────────────────────────────────────────────────────────────────
# CRASH AND RECOVERY
# ─────────────────────────────────────────────────────────────────────────────
#
# [ALL] On out-of-memory: crash rather than silently losing data.
# The pipeline is designed to degrade to an in-process LRU fallback when Redis
# is unavailable — a clean crash is better than a zombie process that
# returns corrupt or empty data without error.
oom-score-adj-values 0 200 800

# Watchdog: signal the process if the event loop blocks for more than N ms.
# 0 = disabled. Enable with a generous value (e.g. 500ms) during incident
# investigation to capture stack traces of event loop stalls.
# crash-log-enabled yes (already set above)